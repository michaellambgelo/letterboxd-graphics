<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>letterboxd-graphics</title>
<style>
  :root {
    /* Overridden per-graphic from cfg.theme — see THEME_DEFAULTS in lib/graphic.mjs.
       The values here are the fallbacks, so a config with no theme block
       renders exactly as it always did. */
    --ground:  #14181c;   /* Letterboxd page background */
    --raised:  #1c2228;
    --ink:     #ffffff;
    --muted:   #9ab;      /* LB metadata grey-blue */
    --faint:   #678;
    --green:   #00e054;
    --blue:    #40bcf4;
    --orange:  #ff8000;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Helvetica Neue", -apple-system, "Segoe UI", Inter, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #sheet {
    width: var(--w);
    height: var(--h);
    padding: 62px 60px 52px;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(120% 80% at 50% -10%, #1b222a 0%, transparent 60%),
      var(--ground);
    overflow: hidden;
  }

  /* ---- header ---- */
  header { flex: none; }

  .eyebrow {
    font-size: var(--fs-eyebrow);
    letter-spacing: .34em;
    text-transform: uppercase;
    color: var(--faint);
    font-weight: 600;
  }

  h1 {
    margin-top: 16px;
    font-size: var(--fs-title);
    line-height: 1.02;
    font-weight: 300;
    letter-spacing: -.022em;
    color: var(--ink);
  }
  h1 .accent {
    font-weight: 700;
    color: var(--accent);
  }

  .subtitle {
    margin-top: 16px;
    font-size: var(--fs-subtitle);
    line-height: 1.45;
    color: var(--muted);
    max-width: 74%;
    font-weight: 300;
  }

  .rule {
    margin-top: 28px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 46%, var(--accent3) 100%);
    opacity: .95;
  }

  /* ---- grid ---- */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 34px 0 6px;
  }
  #grid {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    column-gap: var(--gap);
    row-gap: calc(var(--gap) + 4px);
  }

  .film { display: flex; flex-direction: column; }

  .poster {
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: var(--poster-radius);
    background: var(--raised);
    object-fit: cover;
    display: block;
    box-shadow: 0 10px 26px rgba(0,0,0,.55);
  }

  .film-title {
    margin-top: 13px;
    font-size: var(--fs-film-title);
    font-weight: 600;
    line-height: 1.24;
    max-height: calc(var(--fs-film-title) * 1.24 * 2);
    letter-spacing: -.008em;
    color: var(--ink);
    /* Two lines max — a long title must not shove the row out of alignment. */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Pinned to the bottom of the card: in a row where one title wraps to two
     lines, every card's metadata still sits on the same baseline. */
  .film-foot { margin-top: auto; }

  .film-year {
    margin-top: 4px;
    font-size: var(--fs-film-year);
    color: var(--faint);
    font-weight: 400;
  }

  .film-meta {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Stars: a grey track with a green overlay clipped to the rating, so half
     stars render as an actual half glyph rather than the text "4.5". */
  .stars {
    position: relative;
    display: inline-block;
    font-size: var(--fs-stars);
    line-height: 1;
    letter-spacing: 1.5px;
    white-space: nowrap;
  }
  .stars .track { color: #2c353d; }
  .stars .fill {
    position: absolute;
    inset: 0;
    color: var(--accent);
    overflow: hidden;
    white-space: nowrap;
  }

  .logs {
    font-size: var(--fs-logs);
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--faint);
  }
  .logs.rewatch { color: var(--accent3); }

  /* ---- footer ---- */
  footer {
    flex: none;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 30px;
    padding-top: 22px;
    border-top: 1px solid #232a31;
  }
  .footnote {
    font-size: var(--fs-footnote);
    line-height: 1.5;
    color: var(--faint);
    max-width: 78%;
    font-weight: 300;
  }
  .handle {
    font-size: var(--fs-handle);
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--muted);
    white-space: nowrap;
  }
  .handle {
    display: inline-flex;
    align-items: center;
    gap: 9px;
  }
  /* The official decal, copied from letterboxd-viewer — not a hand-rolled
     imitation. It is a round badge on its own #202830 ground. */
  .handle .decal {
    width: 22px;
    height: 22px;
    display: block;
    flex: none;
  }
</style>
</head>
<body>
<div id="sheet"></div>

<script>
// window.__RENDER__(graphic) paints the sheet and resolves when it has settled.
// The PNG build injects window.__GRAPHIC__ before load and lets the auto-call
// below fire; the editor calls __RENDER__ directly on every keystroke, so the
// preview and the export run the exact same code.
window.__RENDER__ = function (g) {
  const sheet = document.getElementById('sheet');
  document.body.dataset.ready = '0';

  const t = g.theme || {};
  const root = document.documentElement.style;
  if (t.ground) root.setProperty('--ground', t.ground);
  if (t.accent) root.setProperty('--accent', t.accent);
  if (t.accent2) root.setProperty('--accent2', t.accent2);
  if (t.accent3) root.setProperty('--accent3', t.accent3);
  root.setProperty('--gap', (t.gap ?? 26) + 'px');
  root.setProperty('--poster-radius', (t.posterRadius ?? 5) + 'px');

  // Type sizes: each element's px value times the global scale.
  var scale = t.scale == null ? 1 : Number(t.scale) || 1;
  var fs = t.fontSize || {};
  var FS_DEFAULTS = {
    eyebrow: 17, title: 62, subtitle: 19, filmTitle: 16.5,
    filmYear: 14, stars: 15, logs: 13, footnote: 14.5, handle: 14,
  };
  var FS_VARS = {
    eyebrow: '--fs-eyebrow', title: '--fs-title', subtitle: '--fs-subtitle',
    filmTitle: '--fs-film-title', filmYear: '--fs-film-year', stars: '--fs-stars',
    logs: '--fs-logs', footnote: '--fs-footnote', handle: '--fs-handle',
  };
  Object.keys(FS_VARS).forEach(function (k) {
    var px = fs[k] == null ? FS_DEFAULTS[k] : Number(fs[k]);
    if (!isFinite(px)) px = FS_DEFAULTS[k];
    root.setProperty(FS_VARS[k], (px * scale) + 'px');
  });

  sheet.style.setProperty('--w', g.width + 'px');
  sheet.style.setProperty('--h', g.height + 'px');
  sheet.style.setProperty('--cols', g.columns);

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
  ));

  // Split the title so the final word can carry the accent weight.
  function renderTitle(title) {
    const words = String(title || '').trim().split(/\s+/);
    if (!words.length) return '';
    const last = words.pop();
    return esc(words.join(' ')) + (words.length ? ' ' : '') +
           '<span class="accent">' + esc(last) + '</span>';
  }

  function stars(rating) {
    if (rating === null || rating === undefined) return '';
    const pct = Math.max(0, Math.min(1, rating / 5)) * 100;
    const five = '\u2605\u2605\u2605\u2605\u2605';
    return '<span class="stars">' +
             '<span class="track">' + five + '</span>' +
             '<span class="fill" style="width:' + pct + '%">' + five + '</span>' +
           '</span>';
  }

  function logs(n) {
    if (n === null || n === undefined) return '';
    return '<span class="' + (n > 1 ? 'logs rewatch' : 'logs') + '">' +
           n + (n === 1 ? ' log' : ' logs') + '</span>';
  }

  sheet.innerHTML =
    '<header>' +
      (g.eyebrow ? '<div class="eyebrow">' + esc(g.eyebrow) + '</div>' : '') +
      '<h1>' + renderTitle(g.title) + '</h1>' +
      (g.subtitle ? '<p class="subtitle">' + esc(g.subtitle) + '</p>' : '') +
      '<div class="rule"></div>' +
    '</header>' +
    '<main><div id="grid">' +
      (g.films || []).map((f) =>
        '<div class="film">' +
          (f.poster
            ? '<img class="poster" src="' + esc(f.poster) + '" alt="">'
            : '<div class="poster"></div>') +
          '<div class="film-title">' + esc(f.title) + '</div>' +
          '<div class="film-foot">' +
            '<div class="film-year">' + esc(f.year) + '</div>' +
            '<div class="film-meta">' + stars(f.rating) + logs(f.logs) + '</div>' +
          '</div>' +
        '</div>'
      ).join('') +
    '</div></main>' +
    '<footer>' +
      '<div class="footnote">' + esc(g.footer || '') + '</div>' +
      '<div class="handle">' +
        '<img class="decal" src="/assets/letterboxd-decal-dots-rgb.svg" alt="Letterboxd">' +
        '<span>' + esc(g.handle || 'letterboxd.com/michaellamb') + '</span>' +
      '</div>' +
    '</footer>';

  // The exporter waits on this: fonts settled and every image decoded.
  return Promise.all([
    document.fonts.ready,
    ...Array.from(document.images).map((img) =>
      img.complete ? Promise.resolve()
                   : new Promise((res) => { img.onload = img.onerror = res; })
    ),
  ]).then(() => { document.body.dataset.ready = '1'; });
};

if (window.__GRAPHIC__) window.__RENDER__(window.__GRAPHIC__);
</script>
</body>
</html>
