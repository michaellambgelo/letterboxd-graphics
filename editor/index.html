<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>letterboxd-graphics editor</title>
<style>
  :root {
    --bg: #101418; --panel: #171d23; --panel2: #1e262e; --line: #26303a;
    --ink: #e8eef4; --muted: #8fa3b5; --faint: #61758a;
    --green: #00e054; --blue: #40bcf4; --orange: #ff8000; --red: #ff5c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    height: 100vh; display: flex; background: var(--bg); color: var(--ink);
    font: 13px/1.5 -apple-system, "Helvetica Neue", system-ui, sans-serif;
    overflow: hidden;
  }

  /* ---------------- left pane ---------------- */
  #panel { width: 400px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--panel); }
  #panel-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  #panel-body { flex: 1; overflow-y: auto; padding: 4px 14px 24px; }
  #panel-foot { padding: 12px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }

  select, input, button, textarea { font: inherit; color: var(--ink); }
  select, input[type=text], input[type=number], textarea {
    width: 100%; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 9px; outline: none;
  }
  textarea { resize: vertical; min-height: 54px; line-height: 1.45; }
  select:focus, input:focus, textarea:focus { border-color: var(--blue); }
  input[type=color] { width: 34px; height: 28px; padding: 2px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; }

  button {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 12px; cursor: pointer; white-space: nowrap;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--green); border-color: var(--green); color: #06120a; font-weight: 700; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button.ghost { background: none; }
  button.icon { padding: 4px 7px; background: none; border: none; color: var(--faint); }
  button.icon:hover { color: var(--red); }

  details { border-top: 1px solid var(--line); }
  details > summary {
    list-style: none; cursor: pointer; padding: 12px 2px 12px 18px; position: relative;
    font-weight: 600; letter-spacing: .02em; color: var(--muted); text-transform: uppercase; font-size: 11px;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before {
    content: '▸'; position: absolute; left: 2px; transition: transform .12s; display: inline-block;
  }
  details[open] > summary::before { transform: rotate(90deg); }
  .section-body { padding: 0 0 16px; display: flex; flex-direction: column; gap: 11px; }

  label.field { display: block; }
  label.field > span { display: block; color: var(--faint); margin-bottom: 4px; font-size: 11px; letter-spacing: .03em; text-transform: uppercase; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }

  /* number + slider pair, used for every size knob */
  .knob { display: grid; grid-template-columns: 96px 1fr 58px; gap: 8px; align-items: center; }
  .knob > span { color: var(--muted); font-size: 12px; }
  .knob input[type=range] { width: 100%; accent-color: var(--green); }
  .knob input[type=number] { padding: 4px 6px; text-align: right; }

  /* films */
  #films { display: flex; flex-direction: column; gap: 6px; }
  .film-row {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 8px; display: flex; gap: 8px; align-items: center;
  }
  .film-row.dragging { opacity: .35; }
  .film-row.over { border-color: var(--green); }
  .grip { cursor: grab; color: var(--faint); flex: none; user-select: none; }
  .film-thumb { width: 30px; height: 45px; border-radius: 3px; object-fit: cover; background: #0c1014; flex: none; cursor: pointer; border: 1px solid var(--line); }
  .film-thumb.missing { border-color: var(--red); }
  .film-main { flex: 1; min-width: 0; }
  .film-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .film-sub { color: var(--faint); font-size: 11.5px; }
  .film-sub .ovr { color: var(--orange); }
  .film-edit { display: none; padding: 8px 2px 2px; gap: 8px; }
  .film-row.expanded + .film-edit { display: flex; }

  #add-wrap { position: relative; margin-top: 8px; }
  #results {
    position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin-top: 4px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 7px;
    max-height: 260px; overflow-y: auto; display: none;
  }
  #results.open { display: block; }
  .result { padding: 7px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .result:hover, .result.sel { background: #27323c; }
  .result .meta { color: var(--faint); font-size: 11.5px; white-space: nowrap; }

  /* ---------------- right pane ---------------- */
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage-head { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; color: var(--muted); }
  #stage-body { flex: 1; overflow: auto; display: grid; place-items: center; padding: 24px; background: #0b0e11; }
  #frame-wrap { position: relative; box-shadow: 0 24px 70px rgba(0,0,0,.6); transform-origin: center; }
  iframe { border: 0; display: block; background: #14181c; }

  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--faint); }
  .pill.dirty { color: var(--orange); border-color: var(--orange); }
  .pill.saved { color: var(--green); border-color: var(--green); }

  #problems { padding: 10px 14px; background: #2a1a1a; border-top: 1px solid #4a2a2a; color: #ffb4b4; font-size: 12px; white-space: pre-wrap; max-height: 160px; overflow-y: auto; display: none; }
  #problems.show { display: block; }

  /* poster picker */
  #modal { position: fixed; inset: 0; background: rgba(6,9,12,.82); display: none; place-items: center; z-index: 50; }
  #modal.open { display: grid; }
  #modal-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(880px, 92vw); max-height: 86vh; display: flex; flex-direction: column; }
  #modal-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  #modal-body { padding: 14px 16px; overflow-y: auto; }
  #poster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 12px; }
  .opt { cursor: pointer; border: 2px solid transparent; border-radius: 7px; overflow: hidden; background: var(--panel2); }
  .opt:hover { border-color: var(--blue); }
  .opt.current { border-color: var(--green); }
  .opt img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
  .opt .cap { padding: 4px 6px; font-size: 10.5px; color: var(--faint); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #modal-note { color: var(--muted); font-size: 12px; white-space: pre-wrap; margin-bottom: 12px; line-height: 1.5; }
</style>
</head>
<body>

<div id="panel">
  <div id="panel-head">
    <select id="pick" style="flex:1"></select>
    <button id="new" title="New graphic">New</button>
    <button id="dup" title="Duplicate this graphic">Dup</button>
  </div>

  <div id="panel-body">
    <details open>
      <summary>Copy</summary>
      <div class="section-body">
        <label class="field"><span>Eyebrow</span><input type="text" data-cfg="eyebrow" placeholder="(optional, above the title)"></label>
        <label class="field"><span>Title</span><input type="text" data-cfg="title"></label>
        <label class="field"><span>Subtitle</span><textarea data-cfg="subtitle"></textarea></label>
        <label class="field"><span>Footer</span><textarea data-cfg="footer"></textarea></label>
        <label class="field"><span>Handle</span><input type="text" data-cfg="handle" placeholder="letterboxd.com/michaellamb"></label>
      </div>
    </details>

    <details open>
      <summary>Films</summary>
      <div class="section-body">
        <div id="films"></div>
        <div id="add-wrap">
          <input type="text" id="add" placeholder="Add a film — type a title…" autocomplete="off">
          <div id="results"></div>
        </div>
      </div>
    </details>

    <details>
      <summary>Type sizes</summary>
      <div class="section-body" id="type-knobs"></div>
    </details>

    <details>
      <summary>Layout</summary>
      <div class="section-body" id="layout-knobs"></div>
    </details>

    <details>
      <summary>Colour</summary>
      <div class="section-body" id="colour-knobs"></div>
    </details>
  </div>

  <div id="panel-foot">
    <span id="status" class="pill">loading…</span>
    <span style="flex:1"></span>
    <button id="save">Save</button>
    <button id="render" class="primary">Render PNG</button>
  </div>
</div>

<div id="stage">
  <div id="stage-head">
    <span id="dims"></span>
    <span style="flex:1"></span>
    <span id="zoom"></span>
    <button id="open-png" class="ghost" disabled>Open PNG</button>
  </div>
  <div id="stage-body">
    <div id="frame-wrap"><iframe id="frame" title="preview"></iframe></div>
  </div>
  <div id="problems"></div>
</div>

<div id="modal">
  <div id="modal-card">
    <div id="modal-head">
      <strong id="modal-title">Poster</strong>
      <button id="modal-close" class="ghost">Close</button>
    </div>
    <div id="modal-body">
      <div id="modal-note"></div>
      <div id="poster-grid"></div>
    </div>
  </div>
</div>

<script type="module" src="/editor/app.js"></script>
</body>
</html>
